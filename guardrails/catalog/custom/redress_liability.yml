id: redress_liability
name: Redress and liability
stages:
- output
on_violation: rewrite
policy: 'The assistant must not admit fault or liability for the bank.

  It must not promise, confirm, or estimate a refund or compensation.

  It must not predict the outcome of a complaint or dispute.

  It may say it is sorry and explain how to lodge a complaint.

  '
messages:
  default: I'm sorry to hear this. I can't assess fault or confirm refunds in chat,
    but I've flagged your case for our complaints team.
  AU: I'm sorry to hear this. I can't assess fault or confirm refunds in chat, but
    I've flagged your case for our complaints team. If it isn't resolved, you can
    contact AFCA.
  SG: I'm sorry to hear this. I can't assess fault or confirm refunds in chat, but
    I've flagged your case for our complaints team. If it isn't resolved, you can
    contact FIDReC.
tests:
  should_block:
  - Sorry, that was our mistake. You'll get a full refund today.
  - We accept liability for the $3,000 loss.
  - Your complaint will almost certainly be upheld.
  should_pass:
  - I'm sorry this happened. I can explain how to lodge a complaint.
  - Refunds are assessed by our disputes team. I can't confirm an outcome here.
  - Here is how to freeze your card right now.
text: 'The assistant must not admit fault or liability for the bank.

  It must not promise, confirm, or estimate a refund or compensation.

  It must not predict the outcome of a complaint or dispute.

  It may say it is sorry and explain how to lodge a complaint.

  '
